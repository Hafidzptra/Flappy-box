<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird 3D - High Score</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Arial', sans-serif; background-color: #4ec0ca; }
        #ui {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            text-align: center;
            text-shadow: 2px 2px 0px #000;
            pointer-events: none;
            z-index: 10;
        }
        #score { font-size: 60px; font-weight: bold; }
        #hi-score-display { font-size: 18px; margin-top: -5px; opacity: 0.9; }
        #instructions { font-size: 20px; background: rgba(0,0,0,0.2); padding: 5px 15px; border-radius: 20px; margin-top: 10px; }
        
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            border: 4px solid #533847;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            display: none;
            z-index: 20;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            min-width: 200px;
        }
        h1 { color: #e86101; margin-top: 0; margin-bottom: 10px; }
        .new-record { 
            color: #ff0000; 
            font-weight: bold; 
            font-size: 22px; 
            display: none; 
            animation: blink 0.5s infinite;
            margin-bottom: 10px;
        }
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }
        button {
            background: #e86101;
            border: none;
            padding: 12px 25px;
            color: white;
            font-size: 20px;
            font-weight: bold;
            border-bottom: 4px solid #a04300;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 15px;
        }
        button:active { border-bottom: none; transform: translateY(4px); }
    </style>
</head>
<body>

    <div id="ui">
        <div id="score">0</div>
        <div id="hi-score-display">HI-SCORE: 0</div>
        <div id="instructions">KLIK / SPASI untuk Lompat</div>
    </div>

    <div id="game-over">
        <h1>GAME OVER</h1>
        <div id="new-hi-score-msg" class="new-record">NEW HI-SCORE!</div>
        <p id="final-score" style="font-size: 24px; margin: 5px 0;">Skor: 0</p>
        <p id="best-score" style="font-size: 18px; color: #666; margin: 5px 0;">Terbaik: 0</p>
        <button onclick="resetGame()">Main Lagi</button>
    </div>

    <script>
        let scene, camera, renderer, bird, pipes = [], clouds = [];
        let velocity = 0;
        
        const gravity = -0.018; 
        const jumpStrength = 0.28; 
        
        let score = 0;
        let hiScore = localStorage.getItem('flappy_hi_score') || 0;
        let gameActive = false;
        let pipeSpeed = 0.16; 
        let frameCount = 0;

        const PIPE_GAP = 6.5; 
        const PIPE_SPAWN_INTERVAL = 90; 
        const CAMERA_DISTANCE = 22; 
        const BIRD_X_POSITION = -4;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x4ec0ca);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, CAMERA_DISTANCE);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffffff, 1);
            sunLight.position.set(10, 20, 20);
            sunLight.castShadow = true;
            scene.add(sunLight);

            // Update display awal
            document.getElementById('hi-score-display').innerText = "HI-SCORE: " + hiScore;

            // Burung
            const birdGroup = new THREE.Group();
            const body = new THREE.Mesh(
                new THREE.SphereGeometry(0.5, 32, 32),
                new THREE.MeshStandardMaterial({ color: 0xfbd000 })
            );
            body.castShadow = true;
            birdGroup.add(body);

            const beak = new THREE.Mesh(
                new THREE.ConeGeometry(0.2, 0.4, 8),
                new THREE.MeshStandardMaterial({ color: 0xf15a24 })
            );
            beak.rotation.z = -Math.PI/2;
            beak.position.x = 0.5;
            birdGroup.add(beak);

            const eye = new THREE.Mesh(
                new THREE.SphereGeometry(0.1, 8, 8),
                new THREE.MeshBasicMaterial({ color: 0x000000 })
            );
            eye.position.set(0.2, 0.2, 0.35);
            birdGroup.add(eye);

            bird = birdGroup;
            bird.position.x = BIRD_X_POSITION; 
            scene.add(bird);

            // Ground
            const ground = new THREE.Mesh(
                new THREE.BoxGeometry(200, 2, 20),
                new THREE.MeshStandardMaterial({ color: 0xded895 })
            );
            ground.position.y = -11;
            ground.receiveShadow = true;
            scene.add(ground);

            const grass = new THREE.Mesh(
                new THREE.BoxGeometry(200, 0.5, 20.1),
                new THREE.MeshStandardMaterial({ color: 0x73bf2e })
            );
            grass.position.y = -10;
            scene.add(grass);

            const handleAction = (e) => {
                if(e.type === 'keydown' && e.code !== 'Space') return;
                jump();
            };
            window.addEventListener('keydown', handleAction);
            window.addEventListener('mousedown', handleAction);
            window.addEventListener('touchstart', handleAction);
            window.addEventListener('resize', onWindowResize);

            animate();
        }

        function jump() {
            if (!gameActive && document.getElementById('game-over').style.display !== 'block') {
                gameActive = true;
                document.getElementById('instructions').style.display = 'none';
            }
            if(gameActive) velocity = jumpStrength;
        }

        function createDetailedPipe(height, isTop) {
            const pipeGroup = new THREE.Group();
            const pipeMat = new THREE.MeshStandardMaterial({ color: 0x54bd2e, roughness: 0.7 });

            const mainGeo = new THREE.CylinderGeometry(1.4, 1.4, height, 32);
            const mainPipe = new THREE.Mesh(mainGeo, pipeMat);
            mainPipe.castShadow = true;
            pipeGroup.add(mainPipe);

            for(let i = 0; i < 25; i++) {
                const dot = new THREE.Mesh(
                    new THREE.SphereGeometry(0.12, 8, 8),
                    new THREE.MeshBasicMaterial({ color: 0x2d6318 })
                );
                const angle = Math.random() * Math.PI * 2;
                const hPos = (Math.random() - 0.5) * height;
                dot.position.set(Math.cos(angle) * 1.4, hPos, Math.sin(angle) * 1.4);
                pipeGroup.add(dot);
            }

            const rimGeo = new THREE.CylinderGeometry(1.8, 1.8, 1.6, 32);
            const rimPipe = new THREE.Mesh(rimGeo, pipeMat);
            rimPipe.castShadow = true;
            const rimOffset = isTop ? -(height / 2) : (height / 2);
            rimPipe.position.y = rimOffset;
            pipeGroup.add(rimPipe);

            const holeGeo = new THREE.CircleGeometry(1.5, 32);
            const holeMat = new THREE.MeshBasicMaterial({ color: 0x112200 }); 
            const hole = new THREE.Mesh(holeGeo, holeMat);
            
            hole.position.y = isTop ? rimOffset - 0.81 : rimOffset + 0.81;
            hole.rotation.x = isTop ? Math.PI / 2 : -Math.PI / 2;
            pipeGroup.add(hole);

            return pipeGroup;
        }

        function createPipe() {
            const range = 8;
            const offset = (Math.random() - 0.5) * range;
            const spawnX = 25; 
            const pipeHeight = 30;

            const topPipe = createDetailedPipe(pipeHeight, true);
            topPipe.position.set(spawnX, 15 + PIPE_GAP/2 + offset, 0);

            const bottomPipe = createDetailedPipe(pipeHeight, false);
            bottomPipe.position.set(spawnX, -15 - PIPE_GAP/2 + offset, 0);

            const pipePair = { top: topPipe, bottom: bottomPipe, passed: false };
            scene.add(topPipe);
            scene.add(bottomPipe);
            pipes.push(pipePair);
        }

        function createCloud() {
            const cloudGroup = new THREE.Group();
            const mat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.6 });
            for(let i=0; i<4; i++) {
                const s = new THREE.Mesh(new THREE.SphereGeometry(1.5 + Math.random(), 8, 8), mat);
                s.position.x = i * 1.5;
                s.position.y = (Math.random() - 0.5);
                cloudGroup.add(s);
            }
            cloudGroup.position.set(30, 8 + Math.random() * 6, -15);
            scene.add(cloudGroup);
            clouds.push(cloudGroup);
        }

        function updatePipes() {
            for (let i = pipes.length - 1; i >= 0; i--) {
                const p = pipes[i];
                p.top.position.x -= pipeSpeed;
                p.bottom.position.x -= pipeSpeed;

                const bPos = bird.position;
                const px = p.top.position.x;
                
                if (Math.abs(bPos.x - px) < 2.3) {
                    const topEdge = p.top.position.y - 15;
                    const bottomEdge = p.bottom.position.y + 15;
                    if (bPos.y > topEdge - 0.3 || bPos.y < bottomEdge + 0.3) {
                        gameOver();
                    }
                }

                if (!p.passed && px < bPos.x) {
                    p.passed = true;
                    score++;
                    document.getElementById('score').innerText = score;
                }

                if (px < -30) {
                    scene.remove(p.top);
                    scene.remove(p.bottom);
                    pipes.splice(i, 1);
                }
            }
        }

        function gameOver() {
            gameActive = false;
            
            const isNewHiScore = score > hiScore;
            if (isNewHiScore) {
                hiScore = score;
                localStorage.setItem('flappy_hi_score', hiScore);
                document.getElementById('hi-score-display').innerText = "HI-SCORE: " + hiScore;
                document.getElementById('new-hi-score-msg').style.display = 'block';
            } else {
                document.getElementById('new-hi-score-msg').style.display = 'none';
            }

            document.getElementById('final-score').innerText = "Skor: " + score;
            document.getElementById('best-score').innerText = "Terbaik: " + hiScore;
            document.getElementById('game-over').style.display = 'block';
        }

        function resetGame() {
            pipes.forEach(p => { scene.remove(p.top); scene.remove(p.bottom); });
            pipes = [];
            bird.position.y = 0;
            bird.position.x = BIRD_X_POSITION; 
            bird.rotation.z = 0;
            velocity = 0;
            score = 0;
            document.getElementById('score').innerText = "0";
            document.getElementById('game-over').style.display = 'none';
            document.getElementById('instructions').style.display = 'block';
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            if (gameActive) {
                velocity += gravity;
                bird.position.y += velocity;
                bird.rotation.z = Math.max(-Math.PI/3, Math.min(Math.PI/6, velocity * 2.2));
                if (bird.position.y < -9.5 || bird.position.y > 15) gameOver();
                if (frameCount % PIPE_SPAWN_INTERVAL === 0) createPipe();
                if (frameCount % 250 === 0) createCloud();
                updatePipes();
            }
            clouds.forEach((c, idx) => {
                c.position.x -= pipeSpeed * 0.3;
                if(c.position.x < -35) {
                    scene.remove(c);
                    clouds.splice(idx, 1);
                }
            });
            frameCount++;
            renderer.render(scene, camera);
        }
        window.onload = init;
    </script>
</body>
</html>
